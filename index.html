<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacerlo más fácil · Experiencia 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--teal:#01a09b;--mostaza:#d0bd19;--rojo:#de1b19;--bordo:#691815;--coral:#f04b44;--bg:#f1faf9;--card:#ffffff;--ink:#3a0d0b;--muted:#6b4b48;--sel:#f6efb0;--line:#bfe0de;--on:#1b0a09;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1e;--card:#17302e;--ink:#f7ebe8;--muted:#c9b9b5;--sel:#3a3811;--line:#2c4a47}}
:root[data-theme="dark"]{--bg:#0f1f1e;--card:#17302e;--ink:#f7ebe8;--muted:#c9b9b5;--sel:#3a3811;--line:#2c4a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:20px;line-height:1.5}
.top{background:var(--teal);color:var(--on);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 28px}
.top h1{margin:0;font-size:28px;font-weight:700}
.dots{display:flex;align-items:center;gap:10px;font-weight:700}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--on)}
.dots i.on{background:var(--on)}
main{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:12px 0}
.hero h2{font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0}
.hero p{max-width:600px;margin:0;color:var(--muted)}
.says{display:flex;gap:20px;align-items:center;margin-bottom:26px}
.says .M{width:150px;flex:none}
.bubble{background:var(--card);border:3px solid var(--teal);border-radius:22px;padding:16px 22px;font-size:24px;position:relative}
.bubble small{display:block;font-size:18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
.opt{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:4px solid var(--line);border-radius:20px;padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-height:260px}
.opt .pic{background:#fff;border-bottom:3px solid var(--line);padding:10px}
.opt svg{width:100%;height:130px;display:block}
.opt .tx{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.opt b{font-size:24px;line-height:1.2}
.opt span{color:var(--muted);font-size:18px}
.opt.sel{border-color:var(--mostaza);background:var(--sel)}
.rank,.opt .rank{align-self:flex-start;margin-top:6px;padding:5px 16px;border-radius:999px;font-weight:700;font-size:19px;color:#1b0a09;border:2px solid rgba(0,0,0,.3)}
.r1,.opt .r1{background:var(--mostaza)}.r2,.opt .r2{background:var(--teal)}.r3,.opt .r3{background:var(--coral)}
.fb{margin-top:28px;background:var(--card);border-left:10px solid var(--teal);border-radius:14px;padding:20px 26px}
.fb p{margin:0 0 10px}.fb p:last-child{margin:0}
.verd{font-size:26px;font-weight:700}
.act{margin-top:26px;display:flex;gap:16px;flex-wrap:wrap}
.btn{font:inherit;font-size:24px;font-weight:700;min-height:68px;padding:14px 40px;border:4px solid var(--teal);background:var(--teal);color:var(--on);border-radius:18px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.hint{color:var(--muted);margin-top:20px}
.sum{list-style:none;padding:0;margin:22px 0;display:grid;gap:12px;width:100%;max-width:640px;text-align:left}
.sum li{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
button:focus-visible{outline:5px solid var(--mostaza);outline-offset:3px}
#warn{position:fixed;left:0;right:0;bottom:0;background:var(--mostaza);color:#1b0a09;text-align:center;padding:14px;font-weight:700;font-size:22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#warn[hidden]{display:none}
.foot{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:17px}
.M{display:block;max-width:100%;height:auto}
.M .d{transform-origin:120px 140px;animation:idle 5s ease-in-out infinite}
.M .eyes{transform-origin:120px 93px;animation:blink 4.6s infinite}
.M .m2,.M .sp,.M .Lt{display:none}
.M.react .m1,.M.thumb .m1{display:none}.M.react .m2,.M.thumb .m2{display:inline}
.M.react .sp,.M.thumb .sp{display:inline}
.M.thumb .Lsl{display:none}.M.thumb .Lt{display:inline}
.M.react .d{animation:nod .9s ease-in-out 1}
.M.react.big .d{animation-iteration-count:2}
@keyframes idle{0%,100%{transform:none}50%{transform:rotate(1.2deg)}}
@keyframes nod{0%,100%{transform:none}20%{transform:translateY(5px) rotate(2.5deg)}40%{transform:none}60%{transform:translateY(4px) rotate(-2deg)}80%{transform:none}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><h1>Hacerlo más fácil</h1><div class="dots" id="dots" aria-live="polite"></div></header>
<main id="app"></main>
<div id="warn" role="status" hidden></div>
<script>
const P={t:'#01a09b',m:'#d0bd19',r:'#de1b19',b:'#691815',c:'#f04b44'};
const svg=b=>'<svg viewBox="0 0 120 100" aria-hidden="true">'+b+'</svg>';
const mug=(h2,lid)=>svg('<ellipse cx="60" cy="92" rx="34" ry="5" fill="#0002"/><path d="M38 34h44v38a10 10 0 0 1-10 10H48a10 10 0 0 1-10-10z" fill="'+P.t+'"/><path d="M82 42h6a9 9 0 0 1 0 22h-6" fill="none" stroke="'+P.t+'" stroke-width="6"/>'+(h2?'<path d="M38 42h-6a9 9 0 0 0 0 22h6" fill="none" stroke="'+P.t+'" stroke-width="6"/>':'')+(lid?'<rect x="34" y="27" width="52" height="9" rx="4" fill="'+P.b+'"/><rect x="54" y="20" width="12" height="8" rx="3" fill="'+P.b+'"/>':'<path d="M50 26q-6-7 0-14M62 26q-6-7 0-14" stroke="'+P.c+'" stroke-width="3" fill="none" stroke-linecap="round"/>'));
const pen=(w,bands)=>svg('<line x1="26" y1="80" x2="92" y2="20" stroke="'+P.t+'" stroke-width="'+w+'" stroke-linecap="round"/>'+(bands?'<line x1="30" y1="76" x2="88" y2="23" stroke="'+P.m+'" stroke-width="'+(w+2)+'" stroke-dasharray="6 12"/>':'')+'<polygon points="12,94 22,76 30,86" fill="'+P.b+'"/>');
const btn=k=>svg('<path d="M32 20L46 12Q60 22 74 12L88 20L108 42L94 54L86 46V92H34V46L26 54L12 42Z" fill="'+P.t+'"/><rect x="55" y="34" width="10" height="58" fill="#000" opacity=".12"/><path d="M46 12L60 34L74 12L66 10Q60 18 54 10Z" fill="#fff" stroke="'+P.b+'" stroke-width="2" stroke-linejoin="round"/>'+(k==0?[44,55,66,77].map(y=>'<circle cx="60" cy="'+y+'" r="3.4" fill="#fff" stroke="'+P.b+'" stroke-width="1.6"/>').join(''):k==1?[46,64,82].map(y=>'<circle cx="60" cy="'+y+'" r="7.5" fill="'+P.m+'" stroke="'+P.b+'" stroke-width="2.5"/><circle cx="57.6" cy="'+y+'" r="1.3" fill="'+P.b+'"/><circle cx="62.4" cy="'+y+'" r="1.3" fill="'+P.b+'"/>').join(''):'<rect x="51" y="38" width="7.5" height="52" rx="2" fill="'+P.m+'" stroke="'+P.b+'" stroke-width="1.6"/><rect x="61.5" y="38" width="7.5" height="52" rx="2" fill="'+P.m+'" stroke="'+P.b+'" stroke-width="1.6"/><path d="M54.75 42v44M65.25 42v44" stroke="'+P.b+'" stroke-width="1.6" stroke-dasharray="1 3.2" stroke-linecap="round"/>'));
const INK='#2b1b19',SK='#fbe3d8',HR='#2f1b19',HR2='#6b463f';
const sw=w=>`stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const CL=cl=>cl==1?`<path d="M120 182V260" fill="none" ${sw(2.6)}/>`+[204,228,252].map(y=>`<circle cx="120" cy="${y}" r="8" fill="${P.t}" ${sw(2.4)}/><circle cx="117" cy="${y}" r="1.4" fill="${INK}"/><circle cx="123" cy="${y}" r="1.4" fill="${INK}"/>`).join(''):cl==2?`<rect x="113" y="186" width="6.5" height="72" rx="2" fill="#e8dc5a" ${sw(2)}/><rect x="121" y="186" width="6.5" height="72" rx="2" fill="#e8dc5a" ${sw(2)}/><path d="M116.2 190v64M124.2 190v64" stroke="${P.b}" stroke-width="1.5" stroke-dasharray="1 3.2" stroke-linecap="round" fill="none"/>`:`<path d="M120 182V260" fill="none" ${sw(2.6)}/>`+[206,228,250].map(y=>`<circle cx="120" cy="${y}" r="3.4" fill="${P.b}"/>`).join('');
const martinF=cl=>`<svg class="M" viewBox="0 0 240 260" role="img" aria-label="Martín"><defs><clipPath id="mc"><rect width="240" height="260" rx="28"/></clipPath></defs><g clip-path="url(#mc)"><rect width="240" height="260" fill="${P.t}" opacity=".2"/><path d="M106 128V160H134V128Z" fill="${SK}" ${sw(2.6)}/><path d="M66 168C80 160 100 154 120 170C140 154 160 160 174 168L176 260H64Z" fill="${P.m}" ${sw(2.6)}/><path d="M104 152L120 184L136 152Z" fill="${SK}" ${sw(2.6)}/><path d="M101 150L120 180L108 198L82 174Z" fill="${P.m}" ${sw(2.6)}/><path d="M139 150L120 180L132 198L158 174Z" fill="${P.m}" ${sw(2.6)}/>${CL(cl)}<path d="M76 214H108V228L92 234L76 228ZM132 214H164V228L148 234L132 228Z" fill="${P.m}" ${sw(2.2)}/><path d="M76 228V252H108V228M132 228V252H164V228" fill="none" ${sw(2.2)}/><path d="M81 240H103M137 240H159" stroke="${INK}" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/><path class="Lsl" d="M66 168C52 170 40 178 38 196L34 260H64Z" fill="${P.m}" ${sw(2.6)}/><path d="M174 168C188 170 200 178 202 196L206 260H176Z" fill="${P.m}" ${sw(2.6)}/><g class="d"><ellipse cx="80" cy="98" rx="7" ry="10" fill="${SK}" ${sw(2.4)}/><ellipse cx="160" cy="98" rx="7" ry="10" fill="${SK}" ${sw(2.4)}/><path d="M78 94Q82 98 78 103M162 94Q158 98 162 103" fill="none" ${sw(1.6)}/><path d="M84 88C84 56 100 46 120 46C140 46 156 56 156 88C156 112 148 128 136 136C130 141 125 143 120 143C115 143 110 141 104 136C92 128 84 112 84 88Z" fill="${SK}" ${sw(2.6)}/><path d="M81 86C72 52 88 26 116 24C130 16 152 22 159 40C167 54 166 72 159 86C157 74 153 66 147 62C139 68 128 62 120 58C112 64 101 68 93 62C87 68 83 76 81 86Z" fill="${HR}" ${sw(2.2)}/><path d="M90 46C98 34 110 29 124 29M134 26C146 28 154 36 158 48M100 40C108 36 118 35 128 37" fill="none" stroke="${HR2}" stroke-width="2.2" stroke-linecap="round"/><path d="M92 79Q102 74 111 76M129 76Q138 74 148 79" fill="none" ${sw(3.8)}/><g class="eyes"><circle cx="101" cy="93" r="5.4" fill="${INK}"/><circle cx="139" cy="93" r="5.4" fill="${INK}"/><circle cx="103" cy="91" r="1.9" fill="#fff"/><circle cx="99.5" cy="95" r=".9" fill="#fff"/><circle cx="141" cy="91" r="1.9" fill="#fff"/><circle cx="137.5" cy="95" r=".9" fill="#fff"/></g><path d="M120 96V108Q121 111 126 109" fill="none" ${sw(2.2)}/><path d="M95 88L108 87M132 87L145 88" fill="none" ${sw(2)}/><path class="m1" d="M109 119Q120 125 131 119" fill="none" ${sw(2.4)}/><g class="m2"><path d="M108 117Q120 122 132 117Q128 128 120 128Q112 128 108 117Z" fill="#fff" ${sw(2.2)}/></g></g><g class="Lt"><path d="M58 178L40 214L44 168" fill="none" stroke="${INK}" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 178L40 214L44 168" fill="none" stroke="${P.m}" stroke-width="25.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 170H56" ${sw(2.2)}/><rect x="33" y="122" width="12" height="30" rx="6" fill="${SK}" ${sw(2.4)}/><rect x="31" y="146" width="27" height="24" rx="9" fill="${SK}" ${sw(2.4)}/><path d="M46 155H56M46 161H56" ${sw(1.6)}/></g><path class="sp" d="M50 70l-9-6M46 84l-11-2M56 56l-4-10" fill="none" ${sw(3)}/></g></svg>`;
const martin=martinF(0);
const mp=(c,cl)=>martinF(cl||0).replace('class="M"','class="M '+c+'"');
const S=[
{t:'Desayunar',say:'Quiero tomar mi café sin apuros.',sm:'Lo que más me preocupa es derramarlo.',o:[
{n:'Taza con dos asas',c:'Se sostiene con las dos manos',i:mug(1,0),r:2,w:'Sostenerla con las dos manos reparte el esfuerzo y da más estabilidad.',d:'Dos puntos de agarre.'},
{n:'Taza común',c:'La de siempre',i:mug(0,0),r:1,w:'Funciona, pero tiene un solo punto de agarre y el café queda a la vista: un movimiento brusco puede derramarlo.',d:'Es la referencia para comparar con las otras.'},
{n:'Taza con tapa',c:'Cubre el café',i:mug(0,1),r:3,w:'Como a Martín le preocupa derramar, la tapa resuelve justo eso: el líquido queda contenido aunque la taza se mueva.',d:'Una barrera que contiene el líquido.'}]},
{t:'Escribir',say:'Tengo que completar un formulario.',sm:'Quiero que mi letra se entienda sin cansarme.',o:[
{n:'Lapicera común',c:'Fina y liviana',i:pen(7,0),r:1,w:'Se agarra con pocos dedos, así que pide más fuerza de pellizco y cansa más.',d:'Es la referencia para comparar con las otras.'},
{n:'Lapicera con más peso',c:'Pesa más que una común',i:pen(12,1),r:2,w:'Algunas personas encuentran que el peso extra ayuda a estabilizar el movimiento.',d:'Un peso que da estabilidad.'},
{n:'Lapicera de mango ancho',c:'Se agarra con toda la mano',i:pen(20,0),r:3,w:'Un mango más grueso se agarra con toda la mano y pide menos fuerza de pellizco, que es lo que más cansa a Martín.',d:'Una superficie de agarre más grande.'}]},
{t:'Vestirse',say:'Quiero abrochar mi camisa.',sm:'Y que no se me haga eterno.',o:[
{n:'Botones grandes',c:'Más fáciles de tomar',i:btn(1),cl:1,r:2,w:'Se agarran mejor y pasan por el ojal con más facilidad.',d:'Un tamaño pensado para el agarre.'},
{n:'Botones comunes',c:'Los de siempre',i:btn(0),cl:0,r:1,w:'Piden alinear cada botón con su ojal con movimientos finos, y cuatro veces seguidas.',d:'Es la referencia para comparar con las otras.'},
{n:'Cierre de velcro',c:'Se cierra apoyando una tira',i:btn(2),cl:2,r:3,w:'Se cierra con un gesto de presión, sin alinear botón y ojal: es justo lo que Martín quiere, que sea rápido.',d:'Un cierre que no exige precisión.'}]}];
const RK=['Bien','Mejor','Ideal'],$=id=>document.getElementById(id);
let k=-1,p=[null,null,null],last=Date.now();
function dots(){const n=k>=0&&k<3?k+1:0;$('dots').innerHTML=(k>=0&&k<3?'Situación '+n+' de 3 ':'')+[0,1,2].map(i=>'<i class="'+(i<n||k>=9?'on':'')+'"></i>').join('')}
function badge(r){return '<span class="rank r'+r+'">'+RK[r-1]+' '+'●'.repeat(r)+'○'.repeat(3-r)+'</span>'}
function render(){
 dots();const a=$('app');
 if(k===-1){a.innerHTML='<div class="hero"><div style="width:220px;max-width:100%">'+martin+'</div><h2>Acompañá a Martín en su día</h2><p>Martín convive con temblor esencial. Te cuenta qué necesita y vos elegís el objeto que mejor se lo facilita. Pueden jugar de a 2 personas, por turnos.</p><button class="btn" data-a="go">Empezar</button><p class="hint">Dura unos 4 minutos. Todo se resuelve con un toque.</p></div>';return}
 if(k===9){let li='';p.forEach((c,i)=>{if(c!==null)li+='<li><span><b>'+S[i].t+':</b> '+S[i].o[c].n+'</span>'+badge(S[i].o[c].r)+'</li>'});
  a.innerHTML='<div class="hero"><div style="width:220px;max-width:100%">'+mp('thumb react big',p[2]!==null?S[2].o[p[2]].cl:0)+'</div><h2>¡Gracias por ayudar a Martín!</h2><p>No hay una única solución: cada persona necesita algo distinto. Lo importante es que el diseño le dé opciones.</p><ul class="sum">'+li+'</ul><button class="btn" data-a="reset">Jugar de nuevo</button></div>';return}
 const s=S[k],c=p[k];
 let h='<div class="says">'+mp(c===null?'':'react'+(s.o[c].r===3?' big':''),k===2&&c!==null?s.o[c].cl:0)+'<div class="bubble">'+s.say+'<small>'+s.sm+'</small></div></div><div class="grid">';
 s.o.forEach((o,i)=>{h+='<button class="opt'+(c===i?' sel':'')+'" data-a="o" data-i="'+i+'" aria-pressed="'+(c===i)+'"><div class="pic">'+o.i+'</div><div class="tx"><b>'+o.n+'</b><span>'+o.c+'</span>'+(c!==null?badge(o.r):'')+'</div></button>'});
 h+='</div>';
 if(c!==null){const o=s.o[c],v=o.r===3?'¡Muy buena elección para Martín!':o.r===2?'Buena elección: ayuda, y hay una todavía mejor para lo que Martín necesita.':'Funciona, pero hay opciones que le facilitan más la tarea.';
  h+='<div class="fb"><p class="verd">'+v+'</p><p><b>Por qué ayuda:</b> '+o.w+'</p><p><b>Decisión de diseño:</b> '+o.d+'</p><p class="hint">Podés cambiar tu elección tocando otra opción. Los puntos muestran qué tan bien resuelve cada una lo que Martín necesita.</p></div><div class="act"><button class="btn" data-a="n">'+(k<2?'Siguiente situación':'Ver resultados')+'</button></div>'}
 else h+='<p class="hint">Tocá la opción que le facilite más la tarea. Podés cambiarla cuando quieras.</p>';
 a.innerHTML=h}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='go')k=0;else if(a==='o')p[k]=+b.dataset.i;
 else if(a==='n'){k=k<2?k+1:9}
 else if(a==='reset'){k=-1;p=[null,null,null]}
 render();if(a!=='o')window.scrollTo(0,0);
 if(a==='o'){clearTimeout(window._rt);window._rt=setTimeout(()=>{const m=document.querySelector('.says svg');m&&m.classList.remove('react','big')},1900)}});
['pointerdown','keydown'].forEach(v=>addEventListener(v,()=>{last=Date.now();$('warn').hidden=true}));
setInterval(()=>{if(k===-1)return;const s=(Date.now()-last)/1000;
 if(s>=90){k=-1;p=[null,null,null];$('warn').hidden=true;render()}
 else if(s>=75){$('warn').hidden=false;$('warn').textContent='La pantalla se reinicia en '+Math.ceil(90-s)+' segundos. Tocá para seguir.'}},1000);
render();
</script>
</body>
</html>
